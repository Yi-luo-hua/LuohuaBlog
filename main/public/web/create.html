<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>AI 智能识别 · 新建卡片集 · AI QuizCard</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
  .step {
    border-radius: 24px;
    padding: 22px;
    margin-bottom: 18px;
  }
  .step-head {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 16px;
  }
  .step-num {
    width: 32px; height: 32px; border-radius: 9999px;
    background: var(--primary); color: #fff;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 600; flex-shrink: 0;
  }
  .step-num.done { background: #ecfbf0; color: #3c4a42; border: 1px solid #bbcac0; }
  .step-title { font-size: 16px; font-weight: 600; }

  .ai-paste {
    width: 100%;
    min-height: 200px;
    border: 1px solid var(--outline-variant);
    background: rgba(255,255,255,.7);
    border-radius: 14px;
    padding: 14px 16px;
    font-size: 14px;
    font-family: ui-monospace, "SF Mono", "Cascadia Code", "Consolas", monospace;
    line-height: 1.6;
    outline: none;
    resize: vertical;
  }
  .ai-paste:focus { border-color: var(--primary); background:#fff; box-shadow: 0 0 0 4px rgba(87,96,101,.08); }

  .quick-action {
    display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 0;
  }
  .quick-action button {
    padding: 6px 12px; font-size: 12px; border-radius: 9999px;
    background: rgba(240,249,255,.6); color: var(--primary);
    border: 1px solid rgba(240,249,255,1);
  }
  .quick-action button:hover { background: rgba(240,249,255,.95); }

  .preview-card {
    border-radius: 16px;
    padding: 14px 16px;
    margin-bottom: 10px;
    background: rgba(255,255,255,.7);
    border: 1px solid rgba(255,255,255,.85);
  }
  .preview-card .pidx {
    display: inline-flex; align-items: center; justify-content: center;
    width: 22px; height: 22px; border-radius: 9999px;
    background: var(--primary); color: #fff;
    font-size: 11px; font-weight: 600;
    margin-right: 8px;
    vertical-align: middle;
  }
  .preview-card .pprompt {
    font-size: 14px; font-weight: 600; line-height: 1.4;
    margin-bottom: 8px;
  }
  .preview-card .pprompt input {
    width: 100%; border: 0; padding: 4px 0; font: inherit; outline: none; background: transparent;
    border-bottom: 1px dashed transparent;
  }
  .preview-card .pprompt input:focus { border-bottom-color: var(--primary); }
  .preview-card .popts { display: flex; flex-direction: column; gap: 4px; padding-left: 30px; }
  .popt {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; color: var(--on-surface-variant);
  }
  .popt input[type="radio"] { accent-color: var(--primary); flex-shrink: 0; }
  .popt input[type="text"] {
    flex: 1; border: 0; background: transparent; padding: 2px 0; outline: none;
    border-bottom: 1px dashed transparent;
    font: inherit; color: inherit;
  }
  .popt input[type="text"]:focus { border-bottom-color: var(--primary); }
  .popt.correct { color: #3c4a42; font-weight: 500; }
  .preview-card .phint {
    margin-top: 6px; padding-left: 30px;
    font-size: 12px; color: var(--on-surface-variant);
    background: rgba(240,249,255,.4); border-radius: 8px; padding: 6px 10px;
  }
  .preview-card .pactions {
    display: flex; gap: 6px; justify-content: flex-end; margin-top: 6px;
  }
  .preview-card .pdel {
    color: var(--error); font-size: 12px; padding: 4px 8px;
  }
  .preview-card .pwarn {
    margin-top: 6px; font-size: 12px; color: #93000a;
    background: rgba(255,218,214,.4); padding: 6px 10px; border-radius: 8px;
  }

  .summary-bar {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 12px 16px;
    background: rgba(236,251,240,.5);
    border: 1px solid rgba(187,202,192,.5);
    border-radius: 12px;
    font-size: 13px;
    margin-bottom: 12px;
  }
  .summary-bar.warn {
    background: rgba(255,218,214,.4);
    border-color: rgba(186,26,26,.3);
    color: var(--on-error-container);
  }

  .footer-bar {
    position: sticky; bottom: 16px;
    background: rgba(255,255,255,.85);
    backdrop-filter: blur(20px);
    border:1px solid rgba(255,255,255,.9);
    border-radius: 18px; padding: 12px;
    display: flex; gap: 8px; justify-content: flex-end;
    margin-top: 18px;
    box-shadow: 0 8px 30px rgba(0,0,0,.06);
  }

  .ai-config {
    margin-top: 10px; padding: 10px 12px;
    background: rgba(240,249,255,.5);
    border-radius: 10px;
    font-size: 12px;
    color: var(--on-surface-variant);
  }
  .ai-config summary { cursor: pointer; font-weight: 600; }
  .ai-config .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .ai-config input { padding: 6px 8px; font-size: 12px; border:1px solid var(--outline-variant); border-radius: 6px; background:#fff; }

  .empty-preview {
    text-align: center;
    padding: 30px 20px;
    color: var(--on-surface-variant);
    font-size: 13px;
  }
</style>
</head>
<body>

<main class="page" style="max-width:820px">
  <div style="display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px">
    <div>
      <span class="chip chip-blue">
        <span class="material-symbols-outlined" style="font-size:14px">auto_awesome</span>
        <span id="mode-label">AI 智能识别</span>
      </span>
      <h1 class="page-title" style="margin-top:10px" id="page-title">新建卡片集</h1>
      <p class="page-sub">把题目粘到下方，AI 自动识别成卡片，预览无误后一键保存。</p>
    </div>
    <a class="btn btn-ghost" href="index.html">
      <span class="material-symbols-outlined" style="font-size:18px">arrow_back</span>返回
    </a>
  </div>

  <!-- Step 1: meta -->
  <section class="glass holo-edge step">
    <div class="step-head">
      <span class="step-num">1</span>
      <span class="step-title">卡片集信息</span>
    </div>
    <div class="field"><label>标题</label><input id="f-title" placeholder="例如：高考英语高频词" /></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="field">
        <label>学科 / 分类</label>
        <input id="f-subject" list="subject-list" placeholder="英语 / 物理 / 编程 / 历史…" />
        <datalist id="subject-list">
          <option value="英语"><option value="数学"><option value="物理"><option value="化学">
          <option value="生物学"><option value="历史"><option value="地理"><option value="政治">
          <option value="语文"><option value="编程"><option value="法律"><option value="医学">
        </datalist>
      </div>
      <div class="field">
        <label>计划练习时间</label>
        <input id="f-schedule" type="datetime-local" />
      </div>
    </div>
    <div class="field" style="margin-bottom:0"><label>简介（可选）</label><input id="f-desc" placeholder="一句话描述这套卡片用途" /></div>
  </section>

  <!-- Step 2: paste -->
  <section class="glass holo-edge step" id="step-paste">
    <div class="step-head">
      <span class="step-num" id="step2-num">2</span>
      <span class="step-title">粘贴你的题目</span>
    </div>
    <textarea class="ai-paste" id="paste"
      placeholder="支持多种格式，例如：

1. 哪种神经递质主要负责调节情绪？
A. 多巴胺
B. 血清素
C. 乙酰胆碱
答案: B
解析: 常被叫做"快乐荷尔蒙"

2. 牛顿第二定律是？
A. F = ma
B. E = mc²
C. PV = nRT
答案：A"></textarea>

    <div class="quick-action">
      <button id="btn-sample-1">📚 装个范例：神经科学</button>
      <button id="btn-sample-2">📖 装个范例：英语词卡</button>
      <button id="btn-clear">🗑 清空</button>
    </div>

    <div style="margin-top:14px;padding:10px 12px;background:rgba(240,249,255,.4);border:1px solid var(--outline-variant);border-radius:10px;font-size:12px;color:var(--on-surface-variant)">
      💡 想用真 AI 模型解析？去 <a href="settings.html" style="color:var(--primary);font-weight:600">设置 → AI 接口</a> 配置 Key。未配置时使用本地解析（识别常见格式题目）。
    </div>

    <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
      <button class="btn btn-primary" id="btn-parse">
        <span class="material-symbols-outlined" style="font-size:18px">auto_awesome</span>
        AI 识别成卡片
      </button>
      <span id="parsing-hint" style="font-size:12px;color:var(--on-surface-variant);display:none;align-self:center">
        <span class="material-symbols-outlined" style="font-size:14px;vertical-align:middle">hourglass_top</span>
        正在识别…
      </span>
    </div>
  </section>

  <!-- Step 3: preview -->
  <section class="glass holo-edge step" id="step-preview">
    <div class="step-head">
      <span class="step-num" id="step3-num">3</span>
      <span class="step-title">预览 & 调整（<span id="card-count">0</span> 题）</span>
    </div>

    <div id="summary-bar" class="summary-bar hidden">
      <span class="material-symbols-outlined" style="font-size:18px">task_alt</span>
      <span id="summary-text"></span>
    </div>

    <div id="cards-host">
      <div class="empty-preview">
        粘完题目点上方 <b>"AI 识别"</b> 按钮，识别出来的题会显示在这里。<br>
        每题都可以单独修改、删除。
      </div>
    </div>
  </section>

  <div class="footer-bar">
    <button class="btn btn-ghost" id="btn-cancel">取消</button>
    <button class="btn btn-primary" id="btn-save">
      <span class="material-symbols-outlined" style="font-size:18px">save</span>
      <span id="save-label">保存并开始练习</span>
    </button>
  </div>
</main>

<script type="module">
import { Store, fmtDateTime } from './assets/store.js';
import { parseCards } from './assets/parser.js';
import { mountShell, toast, qs } from './assets/shell.js';
mountShell('create');

const editId = qs('deckId');

let model = {
  title: '', subject: '', desc: '', scheduledAt: null,
  cards: [],
};

// load if editing
(async () => {
  if (editId) {
    const deck = await Store.getDeck(editId);
    model.title = deck.title;
    model.subject = deck.subject;
    model.desc = deck.desc || '';
    model.scheduledAt = deck.scheduledAt || null;
    model.cards = deck.cards.map(c => ({
      prompt: c.prompt, hint: c.hint || '',
      options: c.options.map(o => ({ ...o })),
    }));
    document.getElementById('mode-label').textContent = '编辑卡片集';
    document.getElementById('page-title').textContent = '编辑卡片集';
    document.getElementById('save-label').textContent = '保存修改';
    document.getElementById('f-title').value = model.title;
    document.getElementById('f-subject').value = model.subject;
    document.getElementById('f-desc').value = model.desc;
    if (model.scheduledAt) {
      document.getElementById('f-schedule').value = toLocalInput(model.scheduledAt);
    }
    renderPreview();
  } else {
    // 默认计划时间 = 明天 20:00
    const t = new Date(); t.setDate(t.getDate()+1); t.setHours(20,0,0,0);
    document.getElementById('f-schedule').value = toLocalInput(t.getTime());
    model.scheduledAt = t.getTime();
  }
})();

// meta fields → model
['title','subject','desc'].forEach(k => {
  document.getElementById('f-'+k).addEventListener('input', e => model[k] = e.target.value);
});
document.getElementById('f-schedule').addEventListener('input', e => {
  model.scheduledAt = e.target.value ? new Date(e.target.value).getTime() : null;
});

// AI config persist
// AI config 已经移动到 settings.html，这里删掉相关代码
const cfgKey      = { value: '' };
const cfgModel    = { value: '' };
const cfgEndpoint = { value: '' };
const cfgStatus   = { innerHTML: '' };

// samples
document.getElementById('btn-sample-1').addEventListener('click', () => {
  document.getElementById('paste').value = SAMPLE_NEURO;
});
document.getElementById('btn-sample-2').addEventListener('click', () => {
  document.getElementById('paste').value = SAMPLE_VOCAB;
});
document.getElementById('btn-clear').addEventListener('click', () => {
  document.getElementById('paste').value = '';
});

// PARSE
document.getElementById('btn-parse').addEventListener('click', async () => {
  const text = document.getElementById('paste').value;
  if (!text.trim()) return toast('请先粘贴题目', 'error');

  const hint = document.getElementById('parsing-hint');
  hint.style.display = 'inline-block';
  try {
    const { cards, warnings } = await parseCards(text);
    const usable = cards.filter(c => !c._skip);
    if (!usable.length) {
      toast('没识别到有效题目', 'error');
    } else {
      model.cards = usable.map(c => ({
        prompt: c.prompt,
        hint: c.hint || '',
        options: c.options.map(o => ({ ...o })),
        _warn: c._warn,
      }));
      showSummary(usable.length, warnings);
      renderPreview();
      toast(`识别出 ${usable.length} 题`, 'task_alt');
      // auto-fill title if empty
      if (!model.title && !document.getElementById('f-title').value) {
        const guess = guessTitle(text);
        if (guess) {
          document.getElementById('f-title').value = guess;
          model.title = guess;
        }
      }
    }
  } catch (e) {
    console.error(e);
    toast('解析失败：' + e.message, 'error');
  } finally {
    hint.style.display = 'none';
  }
});

function showSummary(n, warnings) {
  const bar = document.getElementById('summary-bar');
  const txt = document.getElementById('summary-text');
  bar.classList.remove('hidden', 'warn');
  if (warnings && warnings.length) {
    bar.classList.add('warn');
    txt.innerHTML = `识别 <b>${n}</b> 题，但有 ${warnings.length} 处需要确认：<br>${warnings.slice(0,3).join('<br>')}`;
  } else {
    txt.innerHTML = `识别成功：<b>${n}</b> 题，所有题目答案明确，可直接保存。`;
  }
}

function renderPreview() {
  document.getElementById('card-count').textContent = model.cards.length;
  const host = document.getElementById('cards-host');
  if (!model.cards.length) {
    host.innerHTML = `<div class="empty-preview">粘完题目点上方 <b>"AI 识别"</b> 按钮…</div>`;
    return;
  }
  host.innerHTML = '';
  model.cards.forEach((c, i) => host.appendChild(renderCard(c, i)));
}

function renderCard(c, idx) {
  const div = document.createElement('div');
  div.className = 'preview-card';
  div.innerHTML = `
    <div class="pprompt">
      <span class="pidx">${idx+1}</span>
      <input value="${esc(c.prompt)}" placeholder="题干">
    </div>
    <div class="popts" data-opts></div>
    <button class="pdel" data-add-opt style="color:var(--primary);font-size:11px">+ 加选项</button>
    <div class="phint ${c.hint?'':'hidden'}" data-hint-wrap>
      解析：<input data-hint value="${esc(c.hint)}" placeholder="（可选）" style="border:0;background:transparent;outline:none;width:80%;font:inherit;color:inherit">
    </div>
    ${c._warn ? `<div class="pwarn">⚠ ${esc(c._warn)}</div>` : ''}
    <div class="pactions">
      <button class="pdel" data-add-hint>+ 加解析</button>
      <button class="pdel" data-del>删除此题</button>
    </div>
  `;
  // prompt
  div.querySelector('.pprompt input').addEventListener('input', e => c.prompt = e.target.value);
  // hint
  const hintInput = div.querySelector('[data-hint]');
  hintInput.addEventListener('input', e => c.hint = e.target.value);
  div.querySelector('[data-add-hint]').addEventListener('click', () => {
    div.querySelector('[data-hint-wrap]').classList.remove('hidden');
    hintInput.focus();
  });
  // options
  const optsHost = div.querySelector('[data-opts]');
  function renderOpts() {
    optsHost.innerHTML = '';
    c.options.forEach((o, oi) => {
      const row = document.createElement('div');
      row.className = 'popt' + (o.correct ? ' correct' : '');
      row.innerHTML = `
        <input type="radio" name="correct-${idx}" ${o.correct?'checked':''}>
        <span style="font-size:11px;color:var(--on-surface-variant);width:14px">${'ABCDEF'[oi]||oi+1}</span>
        <input type="text" value="${esc(o.text)}" placeholder="选项 ${'ABCDEF'[oi]||oi+1}">
        <button class="pdel" style="padding:2px 4px;font-size:14px" ${c.options.length<=2?'disabled style="opacity:.3"':''}>−</button>
      `;
      const [radio, , text, del] = row.children;
      radio.addEventListener('change', () => {
        c.options.forEach(x => x.correct = false);
        o.correct = true;
        renderOpts();
      });
      text.addEventListener('input', () => o.text = text.value);
      del.addEventListener('click', () => {
        if (c.options.length <= 2) return;
        c.options.splice(oi, 1);
        if (!c.options.some(x => x.correct)) c.options[0].correct = true;
        renderOpts();
      });
      optsHost.appendChild(row);
    });
  }
  renderOpts();
  div.querySelector('[data-add-opt]').addEventListener('click', () => {
    if (c.options.length >= 6) return toast('最多 6 个选项');
    c.options.push({ text:'', correct:false });
    renderOpts();
  });
  // delete card
  div.querySelector('[data-del]').addEventListener('click', () => {
    if (!confirm(`删除第 ${idx+1} 题？`)) return;
    model.cards.splice(idx, 1);
    renderPreview();
  });
  return div;
}

// cancel / save
document.getElementById('btn-cancel').addEventListener('click', () => {
  if (confirm('放弃当前编辑？')) location.href = 'index.html';
});

document.getElementById('btn-save').addEventListener('click', async () => {
  if (!model.title.trim()) return toast('请填写卡片集标题', 'error');
  if (!model.cards.length) return toast('请先识别题目', 'error');
  for (let i = 0; i < model.cards.length; i++) {
    const c = model.cards[i];
    if (!c.prompt.trim()) return toast(`第 ${i+1} 题缺少题干`, 'error');
    const valid = c.options.filter(o => o.text.trim());
    if (valid.length < 2) return toast(`第 ${i+1} 题至少需要 2 个选项`, 'error');
    if (!valid.some(o => o.correct)) return toast(`第 ${i+1} 题请勾选正确答案`, 'error');
  }

  let deck;
  const meta = {
    title: model.title.trim(),
    subject: (model.subject || '通用').trim(),
    desc: model.desc.trim(),
    scheduledAt: model.scheduledAt,
  };
  if (editId) {
    deck = await Store.updateDeck(editId, meta);
    const existing = await Store.listCards(editId);
    for (const c of existing) await Store.deleteCard(c.id);
  } else {
    deck = await Store.createDeck(meta);
  }
  for (const c of model.cards) {
    await Store.createCard({
      deckId: deck.id,
      prompt: c.prompt.trim(),
      hint: (c.hint || '').trim(),
      options: c.options
        .filter(o => o.text.trim())
        .map(o => ({ text: o.text.trim(), correct: !!o.correct })),
    });
  }
  toast(editId ? '已保存修改' : '已创建', 'task_alt');
  setTimeout(() => location.href = editId ? 'index.html' : `practice-setup.html?deckId=${deck.id}`, 600);
});

// --- utilities ---
function esc(s='') { return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toLocalInput(ts) {
  const d = new Date(ts);
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function guessTitle(text) {
  const first = text.trim().split(/\n/)[0];
  if (first && first.length < 30 && !/^\d/.test(first)) return first;
  return '';
}

const SAMPLE_NEURO = `1. 哪种神经递质主要负责调节情绪、预防抑郁？
A. 多巴胺
B. 血清素
C. 乙酰胆碱
D. GABA
答案: B
解析: 常被叫做"快乐荷尔蒙"，许多抗抑郁药通过提高它的浓度起效。

2. 神经元中髓鞘的主要功能是？
A. 储存神经递质
B. 加快电信号传播速度
C. 提供结构支撑
D. 清除离子
答案: B
解析: 多发性硬化症 (MS) 就是髓鞘受损导致的。

3. 海马体的核心功能是？
A. 调节心率
B. 形成长期记忆
C. 控制平衡
D. 处理视觉
答案: B`;

const SAMPLE_VOCAB = `1. 环境
A. Experience
B. Environment
C. Economy
答案: B

2. 本质
A. Essence
B. Existence
C. Evidence
答案: A

3. 韧性
A. Resilience
B. Reliance
C. Reluctance
答案: A`;
</script>
</body>
</html>
