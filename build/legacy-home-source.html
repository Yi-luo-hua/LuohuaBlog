<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>桃之夭夭の创作屋</title>
<script src="site-i18n.js" defer></script>
<link rel="stylesheet" href="site-weather.css">
<script>try{if(localStorage.getItem('siteWeather')==='rainy')document.documentElement.classList.add('weather-rainy');}catch(e){}</script>
<script src="site-weather.js" defer></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh; display:flex; overflow:hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f9fafb;
    color: #3a3a4a;
    transition: background 0.65s ease, color 0.65s ease;
  }
  body.weather-rainy {
    background: #c8d4e2;
    color: #2a3545;
  }

  /* ====== 动态渐变背景（浅底 + 低饱和漂移色块） ====== */
  .bg {
    position:fixed; inset:0; z-index:0;
    overflow: hidden;
    transition: background 0.65s ease;
    background:
      radial-gradient(ellipse 48% 58% at 92% 46%, rgba(255, 255, 255, 0.98), transparent 70%),
      radial-gradient(ellipse 42% 36% at 92% 92%, rgba(255, 253, 249, 0.98), transparent 68%),
      radial-gradient(ellipse 54% 44% at 38% 22%, rgba(255, 247, 220, 0.16), transparent 66%),
      linear-gradient(145deg, #ffffff 0%, #fcfdff 34%, #fffdf8 68%, #fbfcfb 100%);
  }
  .bg::before {
    content: "";
    position: absolute;
    inset: -18%;
    background:
      linear-gradient(120deg,
        rgba(198, 218, 255, 0.22) 0%,
        rgba(255, 226, 238, 0.2) 28%,
        rgba(221, 244, 237, 0.18) 52%,
        rgba(238, 224, 255, 0.18) 74%,
        rgba(255, 246, 222, 0.16) 100%);
    background-size: 220% 220%;
    opacity: 0.72;
    animation: colorFlow 18s ease-in-out infinite alternate;
    pointer-events: none;
  }
  .bg::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 38% 66% at 92% 48%, rgba(255, 255, 255, 0.88), transparent 72%),
      radial-gradient(ellipse 48% 46% at 88% 94%, rgba(255, 255, 255, 0.82), transparent 68%),
      linear-gradient(180deg, rgba(255, 255, 255, 0.58), rgba(255, 255, 255, 0.32) 42%, rgba(255, 255, 255, 0.6));
    pointer-events: none;
  }
  body.weather-rainy .bg {
    background:
      radial-gradient(ellipse 70% 52% at 18% 12%, rgba(108, 128, 152, 0.55), transparent 68%),
      radial-gradient(ellipse 62% 48% at 82% 8%, rgba(92, 112, 138, 0.48), transparent 66%),
      radial-gradient(ellipse 88% 56% at 50% 0%, rgba(78, 98, 122, 0.42), transparent 72%),
      radial-gradient(ellipse 54% 40% at 48% 88%, rgba(160, 178, 198, 0.28), transparent 70%),
      linear-gradient(168deg, #8fa3b8 0%, #a8b8c8 28%, #b8c6d4 52%, #c5d2de 78%, #d0dce6 100%);
    transition: background 0.65s ease;
  }
  body.weather-rainy .bg::before {
    background:
      linear-gradient(125deg,
        rgba(72, 92, 118, 0.38) 0%,
        rgba(118, 138, 162, 0.32) 24%,
        rgba(88, 108, 132, 0.36) 48%,
        rgba(142, 158, 178, 0.28) 72%,
        rgba(96, 118, 142, 0.34) 100%);
    opacity: 0.94;
    animation: rainyCloudDrift 22s ease-in-out infinite alternate;
  }
  body.weather-rainy .bg::after {
    background:
      radial-gradient(ellipse 92% 48% at 50% -4%, rgba(58, 78, 102, 0.38), transparent 70%),
      radial-gradient(ellipse 48% 36% at 12% 28%, rgba(255, 255, 255, 0.12), transparent 68%),
      linear-gradient(180deg, rgba(88, 108, 132, 0.32) 0%, rgba(168, 184, 200, 0.22) 38%, rgba(196, 208, 220, 0.18) 100%);
  }
  @keyframes rainyCloudDrift {
    0%   { transform: translate3d(-3%, 0, 0) scale(1); }
    100% { transform: translate3d(3%, 2%, 0) scale(1.03); }
  }

  .weather-mist {
    position: fixed;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.65s ease;
    background:
      linear-gradient(180deg, rgba(72, 92, 118, 0.14) 0%, transparent 28%),
      radial-gradient(ellipse 120% 80% at 50% 100%, rgba(148, 168, 188, 0.22), transparent 58%);
  }
  body.weather-rainy .weather-mist {
    opacity: 1;
  }
  @keyframes colorFlow {
    0% {
      transform: translate3d(-2%, -1%, 0) scale(1);
      background-position: 0% 45%;
    }
    50% {
      transform: translate3d(2%, 1%, 0) scale(1.04);
      background-position: 70% 55%;
    }
    100% {
      transform: translate3d(1%, -2%, 0) scale(1.02);
      background-position: 100% 45%;
    }
  }

  /* ====== 优雅线条 SVG 背景 ====== */
  .line-art {
    display: none !important;
    position:fixed; inset:0; z-index:1; pointer-events:none;
    opacity: 0.5;
  }
  .line-art svg { width:100%; height:100%; }

  /* ====== 环境动态图形 ====== */
  .ambient-art {
    display: none !important;
    position:fixed; inset:0; z-index:2; pointer-events:none;
    overflow:hidden;
  }
  .ambient-art svg { width:100%; height:100%; }
  .ambient-orbs {
    position:absolute; inset:0;
  }
  .ambient-orb {
    position:absolute;
    border-radius:50%;
    filter: blur(40px);
    opacity:0.2;
    animation: orbDrift var(--orb-dur, 18s) ease-in-out infinite;
    animation-delay: var(--orb-delay, 0s);
  }
  .ambient-orb:nth-child(1) {
    width:220px; height:220px;
    left:18%; top:22%;
    background: radial-gradient(circle, rgba(200, 218, 255, 0.35), transparent 72%);
    --orb-dur: 22s; --orb-delay: 0s;
  }
  .ambient-orb:nth-child(2) {
    width:180px; height:180px;
    right:22%; top:35%;
    background: radial-gradient(circle, rgba(255, 218, 225, 0.32), transparent 72%);
    --orb-dur: 26s; --orb-delay: -4s;
  }
  .ambient-orb:nth-child(3) {
    width:260px; height:260px;
    left:42%; bottom:12%;
    background: radial-gradient(circle, rgba(190, 232, 225, 0.3), transparent 72%);
    --orb-dur: 20s; --orb-delay: -8s;
  }
  @keyframes orbDrift {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33%      { transform: translate(24px, -18px) scale(1.06); }
    66%      { transform: translate(-16px, 14px) scale(0.94); }
  }

  /* 右侧人物立绘（全身贴底） */
  .hero-figure {
    position: fixed;
    z-index: 4;
    right: 0;
    bottom: 0;
    height: 100vh;
    width: min(42vw, 680px);
    pointer-events: none;
    display: flex;
    align-items: flex-end;
    justify-content: flex-end;
    background: transparent;
    isolation: isolate;
    animation: figureFloat 9s ease-in-out infinite;
  }
  .hero-figure::before {
    --figure-aura-opacity-low: 0.58;
    --figure-aura-opacity-high: 0.82;
    content: "";
    position: absolute;
    right: -8%;
    bottom: 2%;
    width: 78%;
    height: 86%;
    z-index: 0;
    background:
      linear-gradient(132deg, rgba(255, 255, 255, 0.5), rgba(207, 226, 255, 0.18) 46%, rgba(255, 224, 236, 0.12)),
      radial-gradient(ellipse 62% 72% at 58% 52%, rgba(255, 255, 255, 0.72), transparent 72%);
    clip-path: polygon(46% 0, 98% 16%, 96% 72%, 72% 100%, 18% 88%, 0 38%);
    filter: blur(18px);
    opacity: 0.72;
    animation: figureAura 7.5s ease-in-out infinite;
  }
  .hero-figure img {
    --figure-shadow-low: drop-shadow(0 16px 40px rgba(100, 110, 140, 0.2));
    --figure-shadow-high: drop-shadow(0 22px 52px rgba(116, 124, 150, 0.24));
    --figure-tone: saturate(1) brightness(1);
    position: relative;
    z-index: 1;
    display: block;
    height: min(104vh, 1120px);
    width: auto;
    max-width: 100%;
    object-fit: contain;
    object-position: bottom right;
    background: transparent !important;
    filter: var(--figure-shadow-low) var(--figure-tone);
    animation: figureBreath 6.5s ease-in-out infinite;
  }
  /* 双击 file:// 打开 JPG 时：用混合模式减轻白底（透明 PNG 不用） */
  .hero-figure img.hero-figure-img--multiply {
    mix-blend-mode: multiply;
  }
  .hero-figure-hint {
    position: absolute;
    right: 12px;
    bottom: 12px;
    max-width: 220px;
    padding: 10px 14px;
    font-size: 11px;
    line-height: 1.55;
    color: #9a96a8;
    background: rgba(255, 255, 255, 0.75);
    border: 1px solid rgba(186, 206, 255, 0.35);
    border-radius: 10px;
    pointer-events: none;
    z-index: 2;
  }
  @keyframes figureFloat {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-8px); }
  }
  @keyframes figureAura {
    0%, 100% { opacity: var(--figure-aura-opacity-low); transform: translate3d(0, 0, 0) scale(0.98); }
    50%      { opacity: var(--figure-aura-opacity-high); transform: translate3d(-8px, -6px, 0) scale(1.04); }
  }
  @keyframes figureBreath {
    0%, 100% {
      transform: translate3d(0, 0, 0) scale(1);
      filter: var(--figure-shadow-low) var(--figure-tone);
    }
    50% {
      transform: translate3d(-4px, -3px, 0) scale(1.006);
      filter: var(--figure-shadow-high) var(--figure-tone);
    }
  }

  .motion-ribbons {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    opacity: 0.58;
  }
  .motion-ribbons svg {
    width: 100%;
    height: 100%;
    display: block;
  }
  .motion-ribbon {
    fill: none;
    stroke-linecap: round;
    stroke-width: 1.4;
    stroke-dasharray: 8 18;
    animation: ribbonFlow var(--dur, 16s) linear infinite;
  }
  .motion-ribbon--blue { stroke: rgba(160, 185, 245, 0.34); --dur: 18s; }
  .motion-ribbon--pink { stroke: rgba(230, 168, 208, 0.26); --dur: 22s; animation-direction: reverse; }
  .motion-ribbon--mint { stroke: rgba(150, 215, 198, 0.24); --dur: 20s; }
  @keyframes ribbonFlow {
    0%   { stroke-dashoffset: 0; opacity: 0.38; }
    50%  { opacity: 0.72; }
    100% { stroke-dashoffset: -180; opacity: 0.38; }
  }

  .sparkle-field {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
  }
  .sparkle-field span {
    position: absolute;
    left: var(--x);
    top: var(--y);
    width: var(--s, 10px);
    height: var(--s, 10px);
    opacity: 0;
    transform: rotate(45deg) scale(0.6);
    animation: sparkleTwinkle var(--dur, 5.8s) ease-in-out infinite;
    animation-delay: var(--delay, 0s);
  }
  .sparkle-field span::before,
  .sparkle-field span::after {
    content: "";
    position: absolute;
    inset: 45% 0;
    border-radius: 999px;
    background: rgba(176, 156, 220, 0.38);
  }
  .sparkle-field span::after {
    transform: rotate(90deg);
    background: rgba(145, 198, 214, 0.34);
  }
  @keyframes sparkleTwinkle {
    0%, 100% { opacity: 0; transform: rotate(45deg) translateY(6px) scale(0.45); }
    48%, 56% { opacity: 0.72; transform: rotate(45deg) translateY(0) scale(1); }
  }

  .particle-layer {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    overflow: hidden;
    opacity: 0.62;
    mix-blend-mode: screen;
  }
  .particle-layer span {
    position: absolute;
    left: var(--x);
    top: var(--y);
    width: var(--s);
    height: var(--s);
    border-radius: 999px;
    background:
      radial-gradient(circle, rgba(255, 255, 255, 0.95) 0 18%, var(--c) 42%, transparent 72%);
    box-shadow:
      0 0 calc(var(--s) * 1.2) var(--c),
      0 0 calc(var(--s) * 2.4) rgba(255, 255, 255, 0.46);
    opacity: 0;
    transform: translate3d(0, 18px, 0) scale(0.65);
    animation: particleFloat var(--dur) ease-in-out infinite;
    animation-delay: var(--delay);
  }
  .particle-layer span:nth-child(3n) {
    border-radius: 46% 54% 52% 48%;
    filter: blur(0.4px);
  }
  .particle-layer span:nth-child(4n) {
    height: calc(var(--s) * 0.55);
    border-radius: 999px;
  }
  @keyframes particleFloat {
    0%, 100% {
      opacity: 0;
      transform: translate3d(0, 18px, 0) scale(0.55);
    }
    22% {
      opacity: var(--o, 0.56);
    }
    58% {
      opacity: var(--o, 0.56);
      transform: translate3d(var(--dx, 18px), -18px, 0) scale(1);
    }
    82% {
      opacity: 0.08;
      transform: translate3d(calc(var(--dx, 18px) * 1.4), -34px, 0) scale(0.72);
    }
  }

  .sunshower-layer {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    overflow: hidden;
    opacity: 0.82;
    mix-blend-mode: screen;
  }
  .sunshower-layer::before {
    content: "";
    position: absolute;
    inset: -22% -10% 0 -10%;
    background:
      linear-gradient(112deg, transparent 0 16%, rgba(255, 231, 150, 0.34) 32%, transparent 50%),
      linear-gradient(118deg, transparent 0 44%, rgba(255, 247, 200, 0.3) 58%, transparent 72%),
      radial-gradient(ellipse 48% 34% at 22% 16%, rgba(255, 242, 186, 0.26), transparent 68%);
    filter: blur(16px);
    animation: sunbeamDrift 14s ease-in-out infinite alternate;
  }
  .sunshower-layer span {
    position: absolute;
    left: var(--x);
    top: -18vh;
    width: var(--w, 1.35px);
    height: var(--h, 90px);
    border-radius: 999px;
    background: linear-gradient(to bottom, transparent, rgba(255, 255, 255, 0.96), rgba(255, 241, 182, 0.56), rgba(178, 215, 255, 0.28), transparent);
    box-shadow: 0 0 10px rgba(255, 244, 194, 0.52);
    opacity: var(--o, 0.42);
    transform: rotate(18deg);
    animation: sunRainFall var(--dur, 5.8s) linear infinite;
    animation-delay: var(--delay, 0s);
  }
  .sunshower-layer span:nth-child(3n) {
    background: linear-gradient(to bottom, transparent, rgba(255, 232, 150, 0.9), rgba(255, 255, 255, 0.7), transparent);
  }
  .sunshower-layer span:nth-child(4n) {
    width: 2px;
    filter: blur(0.15px);
  }
  body.weather-rainy .sunshower-layer {
    opacity: 1;
    mix-blend-mode: normal;
  }
  body.weather-rainy .sunshower-layer::before {
    background:
      radial-gradient(ellipse 88% 40% at 50% 0%, rgba(72, 92, 118, 0.32), transparent 72%),
      linear-gradient(180deg, rgba(118, 142, 168, 0.24), transparent 48%);
    filter: blur(12px);
    opacity: 0.9;
    animation: none;
  }
  body.weather-rainy .sunshower-layer span {
    width: var(--w, 2px);
    height: calc(var(--h, 90px) * 1.72);
    background: linear-gradient(to bottom, transparent, rgba(72, 108, 142, 0.82), rgba(210, 224, 238, 0.92), rgba(58, 92, 128, 0.42), transparent);
    box-shadow: 0 0 10px rgba(108, 140, 172, 0.45);
    opacity: calc(var(--o, 0.42) + 0.34);
    transform: rotate(14deg);
    animation-duration: calc(var(--dur, 5.8s) * 0.52);
  }
  body.weather-rainy .sunshower-layer span:nth-child(3n) {
    background: linear-gradient(to bottom, transparent, rgba(58, 92, 128, 0.72), rgba(228, 236, 244, 0.94), transparent);
  }
  body.weather-rainy .particle-layer {
    opacity: 0.14;
    mix-blend-mode: normal;
  }
  body.weather-rainy .particle-layer span {
    box-shadow: 0 0 calc(var(--s) * 1.2) rgba(140, 168, 192, 0.35);
  }
  body.weather-rainy .motion-ribbons {
    opacity: 0.42;
  }
  body.weather-rainy .motion-ribbon--blue { stroke: rgba(108, 138, 178, 0.42); }
  body.weather-rainy .motion-ribbon--pink { stroke: rgba(128, 148, 172, 0.28); }
  body.weather-rainy .motion-ribbon--mint { stroke: rgba(98, 138, 158, 0.32); }
  body.weather-rainy .sparkle-field {
    opacity: 0.12;
  }
  body.weather-rainy .hero-figure::before {
    --figure-aura-opacity-low: 0.24;
    --figure-aura-opacity-high: 0.38;
    background:
      linear-gradient(132deg, rgba(94, 118, 146, 0.2), rgba(68, 92, 118, 0.16) 46%, rgba(92, 116, 140, 0.1)),
      radial-gradient(ellipse 62% 72% at 58% 52%, rgba(145, 164, 184, 0.28), transparent 72%);
    opacity: 0.34;
  }
  body.weather-rainy .hero-figure img {
    --figure-shadow-low: drop-shadow(0 18px 44px rgba(44, 62, 84, 0.32));
    --figure-shadow-high: drop-shadow(0 22px 52px rgba(48, 66, 88, 0.36));
    --figure-tone: saturate(0.9) brightness(0.95);
  }
  body.weather-rainy .cat-sticker {
    filter: drop-shadow(0 14px 24px rgba(72, 92, 118, 0.18)) saturate(0.9);
    opacity: 0.82;
  }
  body.weather-rainy .soul-quote {
    filter: drop-shadow(0 16px 28px rgba(72, 92, 118, 0.14)) saturate(0.88);
    opacity: 0.8;
  }
  body.weather-rainy .sidebar {
    background: rgba(228, 236, 244, 0.82);
    border-right-color: rgba(88, 112, 138, 0.12);
  }
  body.weather-rainy .blog-name { color: #2e3a4a; }
  body.weather-rainy .blog-sub { color: #6a7a8e; }
  body.weather-rainy .nav-item { color: #7a8a9e; }
  body.weather-rainy .nav-item:hover { background: rgba(88, 112, 138, 0.08); color: #445566; }
  body.weather-rainy .nav-item.active {
    background: rgba(88, 112, 138, 0.12);
    color: #2a3545;
  }
  body.weather-rainy .sidebar-footer {
    border-top-color: rgba(88, 112, 138, 0.1);
    color: #8a9aaa;
  }
  @keyframes sunRainFall {
    0%   { transform: translate3d(0, -18vh, 0) rotate(18deg); opacity: 0; }
    12%  { opacity: var(--o, 0.48); }
    88%  { opacity: var(--o, 0.48); }
    100% { transform: translate3d(28vw, 126vh, 0) rotate(18deg); opacity: 0; }
  }
  @keyframes sunbeamDrift {
    0%   { transform: translate3d(-2%, -1%, 0) scale(1); opacity: 0.68; }
    100% { transform: translate3d(3%, 1%, 0) scale(1.04); opacity: 0.9; }
  }

  .cat-stickers {
    position: fixed;
    z-index: 3;
    left: calc(220px + clamp(72px, 9vw, 180px));
    top: clamp(86px, 13vh, 158px);
    width: min(54vw, 900px);
    height: min(36vh, 360px);
    pointer-events: none;
  }
  .cat-sticker {
    position: absolute;
    display: block;
    width: var(--w);
    height: auto;
    opacity: 0.9;
    transform: translate3d(0, 0, 0) rotate(var(--rot));
    transform-origin: 50% 65%;
    filter: drop-shadow(0 14px 24px rgba(130, 135, 150, 0.12));
    animation: catDrift var(--dur, 8s) ease-in-out infinite;
    animation-delay: var(--delay, 0s);
  }
  .cat-sticker--draw {
    --w: clamp(66px, 5.4vw, 92px);
    --rot: -8deg;
    --dur: 8.5s;
    left: 18%;
    top: 16%;
  }
  .cat-sticker--flower {
    --w: clamp(58px, 5vw, 86px);
    --rot: 7deg;
    --dur: 9.2s;
    --delay: -2.2s;
    left: 48%;
    top: 4%;
    opacity: 0.84;
  }
  .cat-sticker--reading {
    --w: clamp(72px, 6.2vw, 108px);
    --rot: 5deg;
    --dur: 9.8s;
    --delay: -4s;
    left: 72%;
    top: 22%;
    opacity: 0.88;
  }
  @keyframes catDrift {
    0%, 100% { transform: translate3d(0, 0, 0) rotate(var(--rot)); }
    50%      { transform: translate3d(0, -8px, 0) rotate(calc(var(--rot) * -0.45)); }
  }

  .soul-quote {
    position: fixed;
    z-index: 3;
    left: calc(220px + clamp(280px, 24vw, 470px));
    bottom: clamp(205px, 24vh, 280px);
    width: min(31vw, 560px);
    min-width: 360px;
    pointer-events: none;
    opacity: 0.88;
    transform: rotate(-2deg);
    transform-origin: 50% 60%;
    filter: drop-shadow(0 16px 28px rgba(126, 132, 150, 0.1));
    animation: quoteHover 10s ease-in-out infinite;
  }
  .soul-quote img {
    display: block;
    width: 100%;
    height: auto;
  }
  @keyframes quoteHover {
    0%, 100% { transform: translate3d(0, 0, 0) rotate(-2deg); }
    50%      { transform: translate3d(0, -10px, 0) rotate(1deg); }
  }

  .deco-gallery {
    display: none !important;
  }
  .deco-gallery-old {
    position:fixed; z-index:4; pointer-events:none;
    right: clamp(12px, 2.5vw, 36px);
    top: 50%;
    transform: translateY(-50%);
    width: min(720px, 54vw);
    height: min(94vh, 960px);
  }
  .deco-gallery::before {
    content:'';
    position:absolute; inset:-10% -6%;
    background:
      radial-gradient(ellipse 65% 55% at 50% 50%, rgba(255,255,255,0.38), transparent 70%),
      radial-gradient(ellipse 40% 35% at 50% 50%, rgba(200, 210, 230, 0.12), transparent 65%);
    border-radius: 48px;
    filter: blur(2px);
    z-index:0;
  }
  .deco-gallery-inner {
    position:relative;
    width:100%; height:100%;
    display:grid;
    grid-template-columns: 1fr minmax(300px, 66%) 1fr;
    align-items:center;
    gap: clamp(6px, 1.2vw, 16px);
    z-index:1;
  }
  .deco-center {
    grid-column: 2;
    display:flex;
    align-items:center;
    justify-content:center;

<script>
if (false) (function() {
  const svg = document.getElementById('lineSvg');
  const ns = 'http://www.w3.org/2000/svg';
  const W = window.innerWidth, H = window.innerHeight;

  // 大圆环 - 缓慢旋转
  const circles = [];
  for (let i = 0; i < 3; i++) {
    const cx = W * (0.25 + i * 0.3);
    const cy = H * (0.3 + i * 0.2);
    const r = 80 + i * 60;
    const el = document.createElementNS(ns, 'circle');
    el.setAttribute('cx', cx);
    el.setAttribute('cy', cy);
    el.setAttribute('r', r);
    el.setAttribute('fill', 'none');
    el.setAttribute('stroke', `rgba(165,178,198,${0.14 + i * 0.05})`);
    el.setAttribute('stroke-width', '0.8');
    el.setAttribute('stroke-dasharray', `${30 + i * 15} ${60 + i * 20}`);
    svg.appendChild(el);
    circles.push({ el, cx, cy, r, speed: 0.0001 + i * 0.00005 });
  }

  // 优雅弧线
  const arcs = [];
  for (let i = 0; i < 4; i++) {
    const el = document.createElementNS(ns, 'path');
    el.setAttribute('fill', 'none');
    el.setAttribute('stroke', `rgba(175,186,205,${0.12 + i * 0.03})`);
    el.setAttribute('stroke-width', '0.7');
    svg.appendChild(el);
    arcs.push({
      el,
      baseY: H * (0.15 + i * 0.22),
      amp: 30 + Math.random() * 40,
      freq: 0.0004 + Math.random() * 0.0006,
      speed: 0.0003 + Math.random() * 0.0005,
      phase: Math.random() * Math.PI * 2
    });
  }

  let t = 0;
  function animate(ts) {
    t = ts * 0.001;

    // 旋转圆环
    circles.forEach(c => {
      const dashOffset = t * c.speed * 1000 % 200;
      c.el.setAttribute('stroke-dashoffset', dashOffset);
    });

    // 波纹弧线
    arcs.forEach(a => {
      let d = `M 0,${a.baseY}`;
      const steps = 12;
      for (let i = 1; i <= steps; i++) {
        const x = (W / steps) * i;
        const y = a.baseY +
          Math.sin(x * a.freq + t * a.speed) * a.amp * 1.2 +
          Math.cos(x * a.freq * 1.7 - t * a.speed * 0.7 + a.phase) * a.amp * 0.6 +
          Math.sin(x * a.freq * 2.9 + t * a.speed * 1.3) * a.amp * 0.3;
        d += ` L ${x},${y}`;
      }
      a.el.setAttribute('d', d);
    });

    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);

  window.addEventListener('resize', () => location.reload());
})();
</script>

<!-- ====== 环境动态图形动画 (disabled) ====== -->
<script>
if (false) (function() {
  const svg = document.getElementById('ambientSvg');
  if (!svg) return;
  const ns = 'http://www.w3.org/2000/svg';
  let W = window.innerWidth, H = window.innerHeight;

  const defs = document.createElementNS(ns, 'defs');
  const grad = document.createElementNS(ns, 'linearGradient');
  grad.id = 'ambientGrad';
  grad.setAttribute('x1', '0%'); grad.setAttribute('y1', '0%');
  grad.setAttribute('x2', '100%'); grad.setAttribute('y2', '100%');
  [['0%', 'rgba(200,210,228,0.38)'], ['50%', 'rgba(220,228,240,0.2)'], ['100%', 'rgba(185,200,220,0.34)']].forEach(([o, c]) => {
    const s = document.createElementNS(ns, 'stop');
    s.setAttribute('offset', o); s.setAttribute('stop-color', c);
    grad.appendChild(s);
  });
  defs.appendChild(grad);
  svg.appendChild(defs);

  const ribbons = [];
  for (let i = 0; i < 3; i++) {
    const el = document.createElementNS(ns, 'path');
    el.setAttribute('fill', 'none');
    el.setAttribute('stroke', 'url(#ambientGrad)');
    el.setAttribute('stroke-width', String(0.6 + i * 0.15));
    el.setAttribute('stroke-linecap', 'round');
    el.setAttribute('opacity', String(0.2 + i * 0.06));
    svg.appendChild(el);
    ribbons.push({
      el, yBase: H * (0.28 + i * 0.18),
      amp: 45 + i * 25, phase: i * 1.4,
      speed: 0.35 + i * 0.12
    });
  }

  const orbits = [];
  for (let i = 0; i < 4; i++) {
    const el = document.createElementNS(ns, 'ellipse');
    const cx = W * (0.35 + (i % 2) * 0.28);
    const cy = H * (0.4 + (i >> 1) * 0.15);
    el.setAttribute('cx', cx);
    el.setAttribute('cy', cy);
    el.setAttribute('rx', 60 + i * 35);
    el.setAttribute('ry', 28 + i * 12);
    el.setAttribute('fill', 'none');
    el.setAttribute('stroke', `rgba(165,180,200,${0.12 + i * 0.04})`);
    el.setAttribute('stroke-width', '0.6');
    el.setAttribute('stroke-dasharray', '4 12');
    svg.appendChild(el);
    orbits.push({ el, cx, cy, rot: i * 0.7, speed: 0.15 + i * 0.05 });
  }

  const particles = [];
  const n = 28;
  for (let i = 0; i < n; i++) {
    const el = document.createElementNS(ns, 'circle');
    const r = 1.2 + (i % 3) * 0.6;
    el.setAttribute('r', r);
    el.setAttribute('fill', i % 2 ? 'rgba(200,210,228,0.45)' : 'rgba(175,190,210,0.32)');
    svg.appendChild(el);
    particles.push({
      el, x: Math.random() * W, y: Math.random() * H,
      vx: (Math.random() - 0.5) * 0.25,
      vy: -0.08 - Math.random() * 0.2,
      phase: Math.random() * Math.PI * 2,
      pulse: 0.4 + Math.random() * 0.5
    });
  }

  const links = document.createElementNS(ns, 'g');
  links.setAttribute('stroke', 'rgba(175,186,205,0.1)');
  links.setAttribute('stroke-width', '0.5');
  svg.appendChild(links);

  const sparkles = [];
  for (let i = 0; i < 6; i++) {
    const el = document.createElementNS(ns, 'path');
    el.setAttribute('fill', 'none');
    el.setAttribute('stroke', `rgba(200,188,228,${0.2 + i * 0.03})`);
    el.setAttribute('stroke-width', '0.5');
    el.setAttribute('stroke-linecap', 'round');
    svg.appendChild(el);
    sparkles.push({
      el,
      x: W * (0.15 + i * 0.12),
      y: H * (0.2 + (i % 3) * 0.22),
      len: 18 + i * 6,
      angle: i * 0.9,
      spin: 0.2 + i * 0.08
    });
  }

  let t = 0;
  function frame(ts) {
    t = ts * 0.001;

    ribbons.forEach((r, i) => {
      const y0 = r.yBase + Math.sin(t * r.speed * 0.5 + r.phase) * 20;
      let d = `M -40,${y0}`;
      const seg = 8;
      for (let k = 1; k <= seg; k++) {
        const x = (W + 80) * (k / seg) - 40;
        const y = y0 +
          Math.sin(x * 0.004 + t * r.speed + r.phase) * r.amp +
          Math.cos(x * 0.0025 - t * r.speed * 0.6) * r.amp * 0.4;
        const cpx = x - (W + 80) / seg / 2;
        const cpy = y0 + Math.sin(cpx * 0.005 + t * r.speed) * r.amp * 0.8;
        d += ` Q ${cpx},${cpy} ${x},${y}`;
      }
      r.el.setAttribute('d', d);
    });

    orbits.forEach(o => {
      const rot = t * o.speed + o.rot;
      o.el.setAttribute('transform', `rotate(${(rot * 180 / Math.PI).toFixed(2)} ${o.cx} ${o.cy})`);
      o.el.setAttribute('stroke-dashoffset', String((t * 40) % 32));
    });

    while (links.firstChild) links.removeChild(links.firstChild);
    const maxDist = 120;
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      p.x += p.vx + Math.sin(t + p.phase) * 0.15;
      p.y += p.vy;
      if (p.x < 0) p.x = W;
      if (p.x > W) p.x = 0;
      if (p.y < -10) { p.y = H + 10; p.x = Math.random() * W; }
      const op = 0.25 + Math.sin(t * p.pulse + p.phase) * 0.2;
      p.el.setAttribute('cx', p.x);
      p.el.setAttribute('cy', p.y);
      p.el.setAttribute('opacity', op.toFixed(2));
      for (let j = i + 1; j < particles.length; j++) {
        const q = particles[j];
        const dx = p.x - q.x, dy = p.y - q.y;
        const dist = Math.hypot(dx, dy);
        if (dist < maxDist) {
          const line = document.createElementNS(ns, 'line');
          line.setAttribute('x1', p.x); line.setAttribute('y1', p.y);
          line.setAttribute('x2', q.x); line.setAttribute('y2', q.y);
          line.setAttribute('opacity', (0.15 * (1 - dist / maxDist)).toFixed(2));
          links.appendChild(line);
        }
      }
    }

    sparkles.forEach(s => {
      const a = s.angle + t * s.spin;
      const x2 = s.x + Math.cos(a) * s.len;
      const y2 = s.y + Math.sin(a) * s.len;
      const x3 = s.x + Math.cos(a + 2.4) * s.len * 0.55;
      const y3 = s.y + Math.sin(a + 2.4) * s.len * 0.55;
      s.el.setAttribute('d', `M ${s.x},${s.y} L ${x2},${y2} M ${s.x},${s.y} L ${x3},${y3}`);
      s.x += Math.sin(t * 0.3 + s.angle) * 0.08;
      s.y += Math.cos(t * 0.25 + s.angle) * 0.06;
    });

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  window.addEventListener('resize', () => {
    W = window.innerWidth;
    H = window.innerHeight;
    ribbons.forEach((r, i) => { r.yBase = H * (0.28 + i * 0.18); });
    orbits.forEach((o, i) => {
      o.cx = W * (0.35 + (i % 2) * 0.28);
      o.cy = H * (0.4 + (i >> 1) * 0.15);
      o.el.setAttribute('cx', o.cx);
      o.el.setAttribute('cy', o.cy);
    });
  });
})();
</script>

      if (!g) continue;
      const a = g.advanceWidth * sc;
      if (g.path && g.path.commands && g.path.commands.length > 0) {
        paths.push({ d: g.getPath(x, 0, fs).toPathData(2), width: a });
      }
      x += a; tw = Math.max(tw, x);
    }
    return { paths, totalWidth: tw, ascender: f.ascender * sc, descender: Math.abs(f.descender * sc) };
  }

  const r = textToPaths(font, 'Hello', FONT_SIZE);
  const svg = document.createElementNS(ns, 'svg');
  const pad = FONT_SIZE * 0.35;
  svg.setAttribute('viewBox', `0 0 ${r.totalWidth + pad * 2} ${r.ascender + r.descender + pad * 2}`);

  const defs = document.createElementNS(ns, 'defs');
  [0, 1].forEach(gi => {
    const g = document.createElementNS(ns, 'linearGradient');
    g.id = 'g' + gi;
    g.setAttribute('x1', '0%'); g.setAttribute('y1', '0%');
    g.setAttribute('x2', '100%'); g.setAttribute('y2', '10%');
    ['#7b93db', '#9b8fd4', '#c880c0'].forEach((c, i) => {
      const s = document.createElementNS(ns, 'stop');
      s.setAttribute('offset', (i / 2 * 100) + '%');
      s.setAttribute('stop-color', c);
      g.appendChild(s);
    });
    defs.appendChild(g);
  });
  svg.appendChild(defs);

  r.paths.forEach((p, i) => {
    const tmp = document.createElementNS(ns, 'svg');
    const tp = document.createElementNS(ns, 'path');
    tp.setAttribute('d', p.d); tmp.appendChild(tp);
    tmp.style.cssText = 'position:absolute;visibility:hidden;width:0;height:0';
    document.body.appendChild(tmp);
    const len = tp.getTotalLength(); tmp.remove();

    const el = document.createElementNS(ns, 'path');
    el.setAttribute('d', p.d);
    el.style.setProperty('--len', len);
    el.style.setProperty('--dur', '1.5s');
    el.style.setProperty('--delay', (i * 0.12) + 's');
    el.style.strokeDasharray = len;
    el.style.strokeDashoffset = len;
    el.style.stroke = 'url(#g0)';
    el.style.strokeWidth = 2;
    el.classList.add('stroke-path', 'fill-after');
    el.style.fill = 'url(#g1)';
    el.style.fillOpacity = 0;
    svg.appendChild(el);
  });

  document.getElementById('hero').appendChild(svg);
})();

</script>
