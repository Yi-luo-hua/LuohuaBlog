<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh; display:flex; overflow-x:hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
    background: #f9fafb;
  }
  .bg {
    position:fixed; inset:0; z-index:0;
    background:
      radial-gradient(ellipse 72% 58% at 18% 22%, rgba(186, 206, 255, 0.22), transparent 68%),
      radial-gradient(ellipse 62% 56% at 88% 78%, rgba(255, 218, 225, 0.18), transparent 64%),
      radial-gradient(ellipse 52% 48% at 50% 108%, rgba(190, 232, 225, 0.15), transparent 60%),
      radial-gradient(ellipse 44% 40% at 82% 16%, rgba(245, 230, 255, 0.14), transparent 58%),
      linear-gradient(165deg, #fdfefe 0%, #f8f9fb 40%, #fafbfc 100%);
    animation: gradMorph 16s ease-in-out infinite alternate;
  }
  @keyframes gradMorph {
    0%{background:
      radial-gradient(ellipse 72% 58% at 18% 22%, rgba(186, 206, 255, 0.24), transparent 68%),
      radial-gradient(ellipse 62% 56% at 88% 78%, rgba(255, 218, 225, 0.2), transparent 64%),
      radial-gradient(ellipse 52% 48% at 50% 108%, rgba(190, 232, 225, 0.17), transparent 60%),
      radial-gradient(ellipse 44% 40% at 82% 16%, rgba(245, 230, 255, 0.16), transparent 58%),
      linear-gradient(165deg, #fdfefe 0%, #f8f9fb 40%, #fafbfc 100%);}
    100%{background:
      radial-gradient(ellipse 72% 58% at 78% 28%, rgba(200, 210, 255, 0.2), transparent 68%),
      radial-gradient(ellipse 62% 56% at 22% 74%, rgba(255, 228, 210, 0.19), transparent 64%),
      radial-gradient(ellipse 52% 48% at 48% -6%, rgba(200, 236, 245, 0.16), transparent 60%),
      radial-gradient(ellipse 44% 40% at 12% 84%, rgba(235, 242, 255, 0.18), transparent 58%),
      linear-gradient(195deg, #fcfcfd 0%, #f7f8fa 42%, #f9fafb 100%);}
  }
  .sidebar {
    position:relative; z-index:10; width:220px; min-width:220px; height:100vh;
    background: rgba(255,255,255,0.7);
    backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
    border-right: 1px solid rgba(0,0,0,0.04);
    display:flex; flex-direction:column; padding:38px 22px;
  }
  .sidebar-header { display:flex; align-items:center; gap:11px; margin-bottom:18px; }
  .avatar {
    width:36px; height:36px; border-radius:50%; overflow:hidden;
    border: 1.5px solid rgba(0,0,0,0.1); flex-shrink:0;
  }
  .avatar img { width:100%; height:100%; border-radius:50%; object-fit:cover; }
  .blog-name { color:#3a3a4a; font-size:13px; font-weight:500; letter-spacing:1px; }
  .sidebar-social { display:flex; gap:12px; margin-bottom:32px; padding:0 3px; }
  .sidebar-social a {
    display:flex; align-items:center; justify-content:center;
    width:28px; height:28px; border-radius:6px; transition:all 0.25s;
  }
  .sidebar-social a:hover { background:rgba(0,0,0,0.04); }
  .sidebar-nav { flex:1; display:flex; flex-direction:column; gap:0; }
  .nav-item {
    display:flex; align-items:center; gap:11px; padding:9px 13px; border-radius:7px;
    color:#b0b0b8; font-size:12px; letter-spacing:0.5px; text-decoration:none; transition:all 0.25s;
  }
  .nav-item:hover { background:rgba(0,0,0,0.02); color:#666; }
  .nav-item.active { background:rgba(0,0,0,0.03); color:#3a3a4a; }
  .nav-icon { width:17px; height:17px; opacity:0.35; display:flex; align-items:center; justify-content:center; font-size:12px; }
  .nav-item:hover .nav-icon, .nav-item.active .nav-icon { opacity:0.65; }
  .lang-toggle-wrap { padding:0 2px 10px; }
  .lang-toggle {
    width:100%; border:1px solid rgba(0,0,0,0.08); background:rgba(255,255,255,0.55);
    border-radius:8px; padding:8px 6px; font-size:11px; color:#888; cursor:pointer;
    transition:background 0.2s, color 0.2s;
  }
  .lang-toggle:hover { background:rgba(140,160,190,0.12); color:#555; }
  .blog-name-full { line-height:1.35; font-size:12px; max-width:140px; }
  .sidebar-footer {
    padding-top:16px; border-top:1px solid rgba(0,0,0,0.03);
    color:#c0c0c4; font-size:9px; letter-spacing:1px;
  }
  .main { position:relative; z-index:5; flex:1; overflow-y:auto; height:100vh; padding:40px 50px; }
  .sidebar-toggle{position:absolute;top:12px;right:12px;width:28px;height:28px;border:1px solid rgba(0,0,0,0.1);background:rgba(255,255,255,0.6);border-radius:6px;cursor:pointer;font-size:14px;color:#999;display:flex;align-items:center;justify-content:center;z-index:20;transition:all 0.2s}
  .sidebar-toggle:hover{background:rgba(0,0,0,0.04);color:#555}
  .sidebar.collapsed{width:50px;min-width:50px;padding:20px 8px}
  .sidebar.collapsed .sidebar-header,.sidebar.collapsed .blog-name,.sidebar.collapsed .nav-label,.sidebar.collapsed .sidebar-footer,.sidebar.collapsed .sidebar-social,.sidebar.collapsed .lang-toggle-wrap{display:none}
  .sidebar.collapsed .nav-item{justify-content:center;padding:8px}.sidebar.collapsed .sidebar-toggle{top:6px;right:auto;left:50%;transform:translateX(-50%)}.sidebar.collapsed .sidebar-nav{padding-top:30px}
  @media (max-width:768px) {
    .sidebar { width:50px; min-width:50px; padding:20px 8px; }
    .blog-name,.blog-sub,.nav-label,.sidebar-footer,.sidebar-social { display:none; }
    .lang-toggle-wrap { display:block; padding:0 4px 8px; }
    .lang-toggle-wrap .lang-toggle { font-size:10px; padding:6px 2px; }
    .nav-item { justify-content:center; padding:8px; }
    .main { padding:30px 20px; }
  }
  a.gallery-album-card{display:block;}
</style>
