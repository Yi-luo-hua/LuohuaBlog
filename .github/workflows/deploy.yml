name: Deploy Taozhiyy To UCloud

on:
  push:
    branches: [master]
    paths:
      - "main/**"
      - "blog/**"
      - "build/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      UCLOUD_HOST: ${{ secrets.UCLOUD_HOST }}
      UCLOUD_PORT: ${{ secrets.UCLOUD_PORT }}
      UCLOUD_USER: ${{ secrets.UCLOUD_USER }}
      UCLOUD_SUDO_PASSWORD: ${{ secrets.UCLOUD_SUDO_PASSWORD }}
      ROOT_DIR: /var/www/taozhiyy
      TMP_DIR: /tmp/taozhiyy-deploy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: |
            main/package-lock.json
            blog/package-lock.json
            build/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build main
        run: |
          cd main
          npm ci
          npm run build

      - name: Build blog (Hexo)
        run: |
          cd blog
          npm ci
          npm run clean
          npm run build

      - name: Build build (Vite)
        run: |
          cd build
          npm ci
          npm run build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.UCLOUD_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          if [ -n "$UCLOUD_PORT" ]; then
            ssh-keyscan -p "$UCLOUD_PORT" "$UCLOUD_HOST" >> ~/.ssh/known_hosts
          else
            ssh-keyscan "$UCLOUD_HOST" >> ~/.ssh/known_hosts
          fi

      - name: Upload artifacts to remote tmp
        run: |
          SSH_PORT="${UCLOUD_PORT:-22}"
          ssh -p "$SSH_PORT" "$UCLOUD_USER@$UCLOUD_HOST" "mkdir -p $TMP_DIR/main $TMP_DIR/blog $TMP_DIR/build"
          rsync -az --delete -e "ssh -p $SSH_PORT" main/dist/ "$UCLOUD_USER@$UCLOUD_HOST:$TMP_DIR/main/"
          rsync -az --delete -e "ssh -p $SSH_PORT" blog/public/ "$UCLOUD_USER@$UCLOUD_HOST:$TMP_DIR/blog/"
          rsync -az --delete -e "ssh -p $SSH_PORT" build/dist/ "$UCLOUD_USER@$UCLOUD_HOST:$TMP_DIR/build/"

      - name: Switch to production directories
        run: |
          SSH_PORT="${UCLOUD_PORT:-22}"
          ssh -p "$SSH_PORT" "$UCLOUD_USER@$UCLOUD_HOST" "
            set -e
            echo \"$UCLOUD_SUDO_PASSWORD\" | sudo -S -p '' mkdir -p $ROOT_DIR $ROOT_DIR/blog $ROOT_DIR/build
            echo \"$UCLOUD_SUDO_PASSWORD\" | sudo -S -p '' rsync -a --delete $TMP_DIR/main/ $ROOT_DIR/
            echo \"$UCLOUD_SUDO_PASSWORD\" | sudo -S -p '' rsync -a --delete $TMP_DIR/blog/ $ROOT_DIR/blog/
            echo \"$UCLOUD_SUDO_PASSWORD\" | sudo -S -p '' rsync -a --delete $TMP_DIR/build/ $ROOT_DIR/build/
            echo \"$UCLOUD_SUDO_PASSWORD\" | sudo -S -p '' nginx -t
            echo \"$UCLOUD_SUDO_PASSWORD\" | sudo -S -p '' systemctl reload nginx
            rm -rf $TMP_DIR
          "

      - name: Post-deploy health check
        run: |
          curl -fL --max-time 20 https://taozhiyy.top/ > /dev/null
          curl -fL --max-time 20 https://taozhiyy.top/blog/ > /dev/null
          curl -fL --max-time 20 https://taozhiyy.top/build/ > /dev/null
