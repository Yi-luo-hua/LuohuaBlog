name: Deploy to UCloud

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Build main
        run: cd main && npm install && npm run build

      - name: Build chronicle
        run: cd build && npm install && npm run build

      - name: Deploy main
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.UCLOUD_HOST }}
          username: ${{ secrets.UCLOUD_USER }}
          key: ${{ secrets.UCLOUD_SSH_KEY }}
          port: 22
          source: main/dist/*
          target: /var/www/taozhiyy/
          strip_components: 2
          rm: false

      - name: Deploy blog
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.UCLOUD_HOST }}
          username: ${{ secrets.UCLOUD_USER }}
          key: ${{ secrets.UCLOUD_SSH_KEY }}
          port: 22
          source: blog/public/*
          target: /var/www/taozhiyy/blog/
          strip_components: 2
          rm: false

      - name: Deploy build
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.UCLOUD_HOST }}
          username: ${{ secrets.UCLOUD_USER }}
          key: ${{ secrets.UCLOUD_SSH_KEY }}
          port: 22
          source: build/dist/*
          target: /var/www/taozhiyy/build/
          strip_components: 2
          rm: false
