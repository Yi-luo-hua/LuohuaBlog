name: Deploy Taozhiyy To UCloud

run-name: Deploy ${{ github.sha }}

# Touch this workflow file when a manual push-triggered redeploy is needed.

on:
  push:
    branches: [master]
    paths:
      - "main/**"
      - "blog/**"
      - "build/**"
      - "acg-api/**"
      - "deploy/**"
      - "shared/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      UCLOUD_HOST: ${{ secrets.UCLOUD_HOST }}
      UCLOUD_PORT: ${{ secrets.UCLOUD_PORT }}
      UCLOUD_USER: ${{ secrets.UCLOUD_USER }}
      UCLOUD_SUDO_PASSWORD: ${{ secrets.UCLOUD_SUDO_PASSWORD }}
      ROOT_DIR: /var/www/taozhiyy
      TMP_DIR: /tmp/taozhiyy-deploy
      VITE_API_BASE: https://taozhiyy.top

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: |
            main/package-lock.json
            blog/package-lock.json
            build/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: acg-api/go.mod

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build acg-api (linux)
        run: |
          cd acg-api
          go mod tidy
          go mod verify
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o acg-api .

      - name: Build main
        run: |
          cd main
          npm ci
          npm run build
        env:
          VITE_API_BASE: ${{ env.VITE_API_BASE }}

      - name: Build blog (Hexo)
        run: |
          cd blog
          npm ci
          npm run clean
          npm run build

      - name: Build build (Vite)
        run: |
          cd build
          npm ci
          npm run build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.UCLOUD_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          if [ -n "$UCLOUD_PORT" ]; then
            ssh-keyscan -p "$UCLOUD_PORT" "$UCLOUD_HOST" >> ~/.ssh/known_hosts
          else
            ssh-keyscan "$UCLOUD_HOST" >> ~/.ssh/known_hosts
          fi

      - name: Upload artifacts to remote tmp
        run: |
          SSH_PORT="${UCLOUD_PORT:-22}"
          ssh -p "$SSH_PORT" "$UCLOUD_USER@$UCLOUD_HOST" "mkdir -p $TMP_DIR/main $TMP_DIR/blog $TMP_DIR/build $TMP_DIR/acg-api $TMP_DIR/ai-assistant"
          rsync -az --delete -e "ssh -p $SSH_PORT" main/dist/ "$UCLOUD_USER@$UCLOUD_HOST:$TMP_DIR/main/"
          rsync -az --delete -e "ssh -p $SSH_PORT" blog/public/ "$UCLOUD_USER@$UCLOUD_HOST:$TMP_DIR/blog/"
          rsync -az --delete -e "ssh -p $SSH_PORT" build/dist/ "$UCLOUD_USER@$UCLOUD_HOST:$TMP_DIR/build/"
          rsync -az -e "ssh -p $SSH_PORT" shared/ai-assistant/ "$UCLOUD_USER@$UCLOUD_HOST:$TMP_DIR/ai-assistant/"
          scp -P "$SSH_PORT" \
            acg-api/acg-api \
            deploy/remote-install-acg-api.sh \
            deploy/acg-api.service \
            "$UCLOUD_USER@$UCLOUD_HOST:$TMP_DIR/acg-api/"

      - name: Install acg-api and nginx /api proxy
        run: |
          SSH_PORT="${UCLOUD_PORT:-22}"
          ssh -p "$SSH_PORT" "$UCLOUD_USER@$UCLOUD_HOST" "
            set -e
            sed -i 's/\r$//' $TMP_DIR/acg-api/remote-install-acg-api.sh
            sed -i 's/\r$//' $TMP_DIR/acg-api/acg-api.service
            chmod +x $TMP_DIR/acg-api/remote-install-acg-api.sh
            bash $TMP_DIR/acg-api/remote-install-acg-api.sh \
              $TMP_DIR/acg-api/acg-api \
              '$UCLOUD_SUDO_PASSWORD' \
              $TMP_DIR/acg-api/acg-api.service
          "

      - name: Sync deployment-managed env on server
        env:
          AUTH_OWNER_PASSWORD: ${{ secrets.AUTH_OWNER_PASSWORD }}
          AUTH_OWNER_SECURITY_ANSWER: ${{ secrets.AUTH_OWNER_SECURITY_ANSWER }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TENCENT_COS_SECRET_ID: ${{ secrets.TENCENT_COS_SECRET_ID }}
          TENCENT_COS_SECRET_KEY: ${{ secrets.TENCENT_COS_SECRET_KEY }}
          TENCENT_COS_BUCKET: ${{ secrets.TENCENT_COS_BUCKET }}
          TENCENT_COS_REGION: ${{ secrets.TENCENT_COS_REGION }}
          TENCENT_COS_BASE_URL: ${{ secrets.TENCENT_COS_BASE_URL }}
          LEGACY_COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          LEGACY_COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          LEGACY_COS_BUCKET: ${{ secrets.COS_BUCKET }}
          LEGACY_COS_REGION: ${{ secrets.COS_REGION }}
          OWNER_PUBLISH_GITHUB_TOKEN: ${{ secrets.OWNER_PUBLISH_GITHUB_TOKEN }}
          OWNER_PUBLISH_GITHUB_OWNER: ${{ secrets.OWNER_PUBLISH_GITHUB_OWNER }}
          OWNER_PUBLISH_GITHUB_REPO: ${{ secrets.OWNER_PUBLISH_GITHUB_REPO }}
          OWNER_PUBLISH_GITHUB_BRANCH: ${{ secrets.OWNER_PUBLISH_GITHUB_BRANCH }}
        run: |
          TENCENT_COS_SECRET_ID="${TENCENT_COS_SECRET_ID:-$LEGACY_COS_SECRET_ID}"
          TENCENT_COS_SECRET_KEY="${TENCENT_COS_SECRET_KEY:-$LEGACY_COS_SECRET_KEY}"
          TENCENT_COS_BUCKET="${TENCENT_COS_BUCKET:-$LEGACY_COS_BUCKET}"
          TENCENT_COS_REGION="${TENCENT_COS_REGION:-$LEGACY_COS_REGION}"
          if [ -z "$AUTH_OWNER_PASSWORD" ] && [ -z "$AUTH_OWNER_SECURITY_ANSWER" ] && [ -z "$PEXELS_API_KEY" ] && [ -z "$PIXABAY_API_KEY" ] && [ -z "$TENCENT_COS_SECRET_ID" ] && [ -z "$TENCENT_COS_SECRET_KEY" ] && [ -z "$TENCENT_COS_BUCKET" ] && [ -z "$TENCENT_COS_REGION" ] && [ -z "$TENCENT_COS_BASE_URL" ] && [ -z "$OWNER_PUBLISH_GITHUB_TOKEN" ] && [ -z "$OWNER_PUBLISH_GITHUB_OWNER" ] && [ -z "$OWNER_PUBLISH_GITHUB_REPO" ] && [ -z "$OWNER_PUBLISH_GITHUB_BRANCH" ]; then
            echo "Skip env sync: no deployment-managed env secrets are set"
            exit 0
          fi
          SSH_PORT="${UCLOUD_PORT:-22}"
          REMOTE_FRAG="/tmp/taozhiyy-auth.env.frag"
          FRAG=$(mktemp)
          chmod 600 "$FRAG"
          : > "$FRAG"
          if [ -n "$AUTH_OWNER_PASSWORD" ]; then
            printf 'AUTH_OWNER_PASSWORD=%s\n' "$AUTH_OWNER_PASSWORD" >> "$FRAG"
          fi
          if [ -n "$AUTH_OWNER_SECURITY_ANSWER" ]; then
            printf 'AUTH_OWNER_SECURITY_ANSWER=%s\n' "$AUTH_OWNER_SECURITY_ANSWER" >> "$FRAG"
          fi
          if [ -n "$PEXELS_API_KEY" ]; then
            printf 'PEXELS_API_KEY=%s\n' "$PEXELS_API_KEY" >> "$FRAG"
          fi
          if [ -n "$PIXABAY_API_KEY" ]; then
            printf 'PIXABAY_API_KEY=%s\n' "$PIXABAY_API_KEY" >> "$FRAG"
          fi
          if [ -n "$TENCENT_COS_SECRET_ID" ]; then
            printf 'TENCENT_COS_SECRET_ID=%s\n' "$TENCENT_COS_SECRET_ID" >> "$FRAG"
          fi
          if [ -n "$TENCENT_COS_SECRET_KEY" ]; then
            printf 'TENCENT_COS_SECRET_KEY=%s\n' "$TENCENT_COS_SECRET_KEY" >> "$FRAG"
          fi
          if [ -n "$TENCENT_COS_BUCKET" ]; then
            printf 'TENCENT_COS_BUCKET=%s\n' "$TENCENT_COS_BUCKET" >> "$FRAG"
          fi
          if [ -n "$TENCENT_COS_REGION" ]; then
            printf 'TENCENT_COS_REGION=%s\n' "$TENCENT_COS_REGION" >> "$FRAG"
          fi
          if [ -n "$TENCENT_COS_BASE_URL" ]; then
            printf 'TENCENT_COS_BASE_URL=%s\n' "$TENCENT_COS_BASE_URL" >> "$FRAG"
          fi
          if [ -n "$OWNER_PUBLISH_GITHUB_TOKEN" ]; then
            printf 'OWNER_PUBLISH_GITHUB_TOKEN=%s\n' "$OWNER_PUBLISH_GITHUB_TOKEN" >> "$FRAG"
          fi
          if [ -n "$OWNER_PUBLISH_GITHUB_OWNER" ]; then
            printf 'OWNER_PUBLISH_GITHUB_OWNER=%s\n' "$OWNER_PUBLISH_GITHUB_OWNER" >> "$FRAG"
          fi
          if [ -n "$OWNER_PUBLISH_GITHUB_REPO" ]; then
            printf 'OWNER_PUBLISH_GITHUB_REPO=%s\n' "$OWNER_PUBLISH_GITHUB_REPO" >> "$FRAG"
          fi
          if [ -n "$OWNER_PUBLISH_GITHUB_BRANCH" ]; then
            printf 'OWNER_PUBLISH_GITHUB_BRANCH=%s\n' "$OWNER_PUBLISH_GITHUB_BRANCH" >> "$FRAG"
          fi
          PW_Q=$(printf '%q' "$UCLOUD_SUDO_PASSWORD")
          scp -P "$SSH_PORT" deploy/sync-auth-env.sh \
            "$UCLOUD_USER@$UCLOUD_HOST:/tmp/sync-auth-env.sh"
          scp -P "$SSH_PORT" "$FRAG" \
            "$UCLOUD_USER@$UCLOUD_HOST:$REMOTE_FRAG"
          rm -f "$FRAG"
          ssh -p "$SSH_PORT" "$UCLOUD_USER@$UCLOUD_HOST" "
            set -e
            sed -i 's/\r$//' /tmp/sync-auth-env.sh
            chmod +x /tmp/sync-auth-env.sh
            export SUDO_PASSWORD=$PW_Q
            /tmp/sync-auth-env.sh $REMOTE_FRAG
            rm -f /tmp/sync-auth-env.sh $REMOTE_FRAG
          "

      - name: Switch to production directories
        run: |
          SSH_PORT="${UCLOUD_PORT:-22}"
          ssh -p "$SSH_PORT" "$UCLOUD_USER@$UCLOUD_HOST" "
            set -e
            echo \"$UCLOUD_SUDO_PASSWORD\" | sudo -S -p '' mkdir -p $ROOT_DIR $ROOT_DIR/blog $ROOT_DIR/build $ROOT_DIR/ai-assistant
            echo \"$UCLOUD_SUDO_PASSWORD\" | sudo -S -p '' rsync -a --delete $TMP_DIR/main/ $ROOT_DIR/
            echo \"$UCLOUD_SUDO_PASSWORD\" | sudo -S -p '' rsync -a --delete $TMP_DIR/blog/ $ROOT_DIR/blog/
            echo \"$UCLOUD_SUDO_PASSWORD\" | sudo -S -p '' rsync -a --delete $TMP_DIR/build/ $ROOT_DIR/build/
            echo \"$UCLOUD_SUDO_PASSWORD\" | sudo -S -p '' rsync -a $TMP_DIR/ai-assistant/ $ROOT_DIR/ai-assistant/
            echo \"$UCLOUD_SUDO_PASSWORD\" | sudo -S -p '' nginx -t
            echo \"$UCLOUD_SUDO_PASSWORD\" | sudo -S -p '' systemctl reload-or-restart nginx || {
              echo \"ERROR: nginx reload-or-restart failed\"
              echo \"=== nginx status ===\"
              echo \"$UCLOUD_SUDO_PASSWORD\" | sudo -S -p '' systemctl --no-pager --full status nginx || true
              echo \"=== nginx processes ===\"
              echo \"$UCLOUD_SUDO_PASSWORD\" | sudo -S -p '' ps aux | grep '[n]ginx' || true
              echo \"=== listening ports ===\"
              echo \"$UCLOUD_SUDO_PASSWORD\" | sudo -S -p '' sh -c 'if command -v ss >/dev/null 2>&1; then ss -tlnp; else netstat -tlnp; fi' | grep -E ':(80|443)[[:space:]]' || true
              echo \"=== nginx journal ===\"
              echo \"$UCLOUD_SUDO_PASSWORD\" | sudo -S -p '' journalctl -u nginx -n 200 --no-pager || true
              echo \"=== recent kernel messages ===\"
              echo \"$UCLOUD_SUDO_PASSWORD\" | sudo -S -p '' dmesg 2>&1 | tail -50 || true
              exit 1
            }
            rm -rf $TMP_DIR
          "

      - name: Trigger Bilibili sync (covers)
        run: |
          if ! curl -sf -X POST --max-time 30 https://taozhiyy.top/api/v1/sync/trigger; then
            echo "ERROR: Bilibili sync trigger failed"
            curl -i -X POST --max-time 30 https://taozhiyy.top/api/v1/sync/trigger || true
            SSH_PORT="${UCLOUD_PORT:-22}"
            ssh -p "$SSH_PORT" "$UCLOUD_USER@$UCLOUD_HOST" "
              echo \"$UCLOUD_SUDO_PASSWORD\" | sudo -S -p '' systemctl --no-pager --full status acg-api || true
              echo \"$UCLOUD_SUDO_PASSWORD\" | sudo -S -p '' journalctl -u acg-api -n 120 --no-pager || true
              echo \"$UCLOUD_SUDO_PASSWORD\" | sudo -S -p '' sh -c 'if command -v ss >/dev/null 2>&1; then ss -tlnp; else netstat -tlnp; fi' | grep -E ':(8787)[[:space:]]' || true
              curl -i --max-time 10 http://127.0.0.1:8787/api/v1/health || true
            "
            exit 1
          fi
          echo "sync queued, waiting for downloads..."
          sleep 45
          BODY=$(curl -sf --max-time 30 https://taozhiyy.top/api/v1/bangumi/list)
          echo "$BODY" | head -c 500
          echo ""
          echo "$BODY" | grep -q 'acg/image' && echo "covers: ok" || echo "covers: pending (retry sync later)"

      - name: Post-deploy health check
        run: |
          curl -sf --max-time 20 https://taozhiyy.top/api/v1/health | grep -q '"status":"ok"'
          curl -sf --max-time 20 https://taozhiyy.top/api/v1/wallpapers/draw | grep -q '"item"'
          curl -sf --max-time 20 'https://taozhiyy.top/api/v1/wallpapers/draw?source=api' | grep -q '"apiOnly":true'
          curl -sf --max-time 20 https://taozhiyy.top/api/chat | grep -q '"remaining"'
          curl -fL --max-time 20 https://taozhiyy.top/ > /dev/null
          curl -fL --max-time 20 https://taozhiyy.top/blog/ > /dev/null
          curl -fL --max-time 20 https://taozhiyy.top/build/ > /dev/null
          curl -fL --max-time 20 https://taozhiyy.top/build/post/site-growth-04-homepage-originalization > /dev/null
          curl -fL --max-time 20 https://taozhiyy.top/gallery > /dev/null
          curl -fL --max-time 20 https://taozhiyy.top/gallery/misaka > /dev/null
          curl -fL --max-time 20 https://taozhiyy.top/bili > /dev/null
