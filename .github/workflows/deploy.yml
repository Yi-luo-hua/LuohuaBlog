name: Deploy

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Build main
        run: cd main && npm install && npm run build

      - name: Build chronicle
        run: cd build && npm install && npm run build

      - name: Deploy
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.UCLOUD_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa -r main/dist/* ${{ secrets.UCLOUD_USER }}@${{ secrets.UCLOUD_HOST }}:/tmp/deploy-main/
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa -r blog/public/* ${{ secrets.UCLOUD_USER }}@${{ secrets.UCLOUD_HOST }}:/tmp/deploy-blog/
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa -r build/dist/* ${{ secrets.UCLOUD_USER }}@${{ secrets.UCLOUD_HOST }}:/tmp/deploy-build/
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ${{ secrets.UCLOUD_USER }}@${{ secrets.UCLOUD_HOST }} "
            sudo cp -r /tmp/deploy-main/* /var/www/taozhiyy/
            sudo cp -r /tmp/deploy-blog/* /var/www/taozhiyy/blog/
            sudo cp -r /tmp/deploy-build/* /var/www/taozhiyy/build/
            sudo chown -R www-data:www-data /var/www/taozhiyy
            sudo nginx -t && sudo systemctl reload nginx
            rm -rf /tmp/deploy-*
          "
