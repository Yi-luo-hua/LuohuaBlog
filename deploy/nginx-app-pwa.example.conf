# Example Nginx server block for the personal PWA subdomain.
#
# Use this for:
#   app.taozhiyy.top      PWA installable app
#
# Keep taozhiyy.top as the normal visitor-facing site. The frontend code only
# enables PWA metadata and service worker registration on app.taozhiyy.top, but
# serving the app from a separate subdomain keeps browser caches and install
# state isolated from the main site.
#
# Replace the root path with the directory that contains the built main/dist
# files on your server.

server {
    listen 80;
    server_name app.taozhiyy.top;

    root /var/www/taozhiyy/main;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
