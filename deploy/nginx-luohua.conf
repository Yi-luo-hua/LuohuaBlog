# Production site configuration for the Azure deployment.
#
# Cache policy:
# - content-hashed Vite assets and fonts: one year, immutable
# - unversioned CSS/JS: one hour
# - images, fonts, audio and video: 30 days
# - HTML and SPA fallbacks: revalidate on every visit
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name yiluohua.top www.yiluohua.top app.yiluohua.top _;
    server_tokens off;

    # HTTP-01 renewals must remain reachable without authentication.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 308 https://yiluohua.top$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name yiluohua.top www.yiluohua.top app.yiluohua.top;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/yiluohua.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yiluohua.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:luohua_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /var/www/luohua/main;
    index index.html;
    client_max_body_size 50m;

    # Certbot uses this webroot for the initial certificate and renewals.
    # Keep it reachable over plain HTTP even after all other requests redirect
    # to HTTPS.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location = /api {
        return 308 /api/;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Vite app bundles include a content hash in the final filename. A changed
    # bundle gets a new URL, so browsers can keep the old URL indefinitely.
    location ~* "^/assets/(?:.*/)?[^/]+-[A-Za-z0-9]{8}\.(?:css|js|mjs|png|jpe?g|gif|svg|webp|avif|woff2?)$" {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The locally hosted font subsets use an eight-character content hash.
    location ~* "^/fonts/(?:.*/)?[^/]+\.[0-9a-f]{8}\.(?:woff2?|ttf|otf)$" {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Other /assets files are not guaranteed to be content-hashed.
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
    }

    location ^~ /cos/ {
        alias /var/www/luohua/cos/;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
    }

    location ^~ /images/ {
        alias /var/www/luohua/blog/images/;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
    }

    location = /blog {
        return 308 /blog/;
    }

    # Hexo emits stable CSS/JS filenames that are overwritten during deploys,
    # so keep their freshness window short instead of marking them immutable.
    location ~* "^/blog/.+\.(?:css|js|mjs)$" {
        root /var/www/luohua;
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public";
    }

    location ~* "^/blog/.+\.(?:avif|gif|ico|jpe?g|png|svg|webp|woff2?|ttf|otf|mp3|mp4|ogg|wav|webm)$" {
        root /var/www/luohua;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /blog/ {
        root /var/www/luohua;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }

    # Keep the service worker immediately refreshable even though it is JS.
    location = /sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    # Standalone tools under /web and /showcase do not use hashed filenames.
    location ~* "^/(?!api(?:/|$)|blog(?:/|$)|cos(?:/|$)|assets(?:/|$)).+\.(?:css|js|mjs)$" {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public";
    }

    location ~* "^/(?!api(?:/|$)|blog(?:/|$)|cos(?:/|$)|assets(?:/|$)).+\.(?:avif|gif|ico|jpe?g|png|svg|webp|woff2?|ttf|otf|mp3|mp4|ogg|wav|webm)$" {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
